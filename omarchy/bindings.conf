# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
$terminal = uwsm-app -- xdg-terminal-exec
$browser = brave 

# Browser (already mapped to SUPER SHIFT+B in omarchy)
unbind = SUPER, W
bindd = SUPER, W, Browser, exec, $browser

bindd = SUPER, Q, Kill window, killactive,
bindd = SUPER, D, Launch apps, exec, omarchy-launch-walker
## this broke the sdl command for some reason now. /dynamic-resolution
bindd = SUPER SHIFT, W, Windows RDP, exec, sdl-freerdp3 /u:bill /p:gates /v:127.0.0.1:3389 /cert:ignore /size:1920x1080 /sound
bindd = SUPER SHIFT, A, Audio, exec, omarchy-launch-audio


# Screen lock
bindd = SUPER SHIFT, X, Lock screen, exec, loginctl lock-session

# Window switcher
bindd = SUPER, P, Window switcher, exec, rofi -show window

bindd = SUPER SHIFT, S, Screenshot with editing, exec, omarchy-capture-screenshot
